[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ofsafaerni"
version = "0.2.0"
description = "Local Icelandic and English skill collection, routing and learning"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
icelandic = ["islenska>=2.1,<3"]

[project.scripts]
ofsafaerni = "ofsafaerni.cli:main"

[tool.setuptools.packages.find]
include = ["ofsafaerni*"]
